services:
  api:
    build:
      context: .
      target: api
    ports:
      - "4001:4001"
    environment:
      PORT: 4001
      JWT_SECRET: ${JWT_SECRET:-vita-compose-secret}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379
    volumes:
      - uploads:/app/uploads
    depends_on:
      - redis

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  uploads:
