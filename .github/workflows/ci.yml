name: Vita CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Docker build API
        continue-on-error: true
        run: docker build --target api -t barq-api .
      - name: Docker build Web
        continue-on-error: true
        run: docker build --target web -t barq-web .
